<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
    main { max-width: 400px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { text-align: center; }
    input[type="text"] { width: 70%; padding: 8px; margin-right: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 12px; border: none; background: #0070f3; color: #fff; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005bb5; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <main>
    <h1>To Do List</h1>
    <div>
      <input type="text" id="newTask" placeholder="Add a new task...">
      <button onclick="addTask()">Add Task</button>
    </div>
    <ul id="todoList"></ul>
  </main>
  <script>
    // Simple unique ID generator
    function generateId() {
      return Date.now() + '-' + Math.floor(Math.random() * 1000000);
    }

    const defaultTasks = [
      { id: generateId(), task: 'Learn React' },
      { id: generateId(), task: 'Learn Next.js' },
      { id: generateId(), task: 'Learn Copilot' }
    ];

    let todoList = [...defaultTasks];

    function renderList() {
      const ul = document.getElementById('todoList');
      ul.innerHTML = '';
      todoList.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${item.task}</span> <button onclick="deleteTask('${item.id}')">Delete</button>`;
        ul.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('newTask');
      const task = input.value.trim();
      if (task !== '') {
        todoList.push({ id: generateId(), task });
        input.value = '';
        renderList();
      }
    }

    function deleteTask(id) {
      todoList = todoList.filter(item => item.id !== id);
      renderList();
    }

    // Initial render
    renderList();
  </script>
</body>
</html>
